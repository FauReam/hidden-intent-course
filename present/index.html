<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Models Know, But Don't Always Say — CSI-435/535</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="boot">

  <!-- drifting aurora background -->
  <div class="aurora" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <!-- progress -->
  <div id="progressbar"><div id="progressfill"></div></div>

  <!-- corner branding -->
  <div id="branding">CSI-435/535 · Fall 2026</div>
  <div id="counter">1 / 12</div>

  <!-- the paper window: fixed on the right for every scene -->
  <div id="paper-frame">
    <div id="paper-window">
      <div id="paper-loading">
        <div class="spinner"></div>
        <div class="loading-text">opening the paper…</div>
      </div>
      <div id="paper-pages"></div>
    </div>
  </div>

  <!-- hero figure (PCA result scene): floats over the left stage -->
  <div id="hero-panel" class="hidden">
    <img id="hero-img" src="assets/pca_two_clusters.png" alt="PCA of last-token activations: true and false statements form two clusters">
    <div id="hero-caption">Each point = one statement's last-token activation (LLaMA-2-13B, layer 14), top-2 principal components. <em>PCA never saw the labels.</em></div>
  </div>

  <!-- left stage: rich scene content -->
  <div id="scene-layer">
    <div id="scene-content"></div>
  </div>

  <!-- speaker notes (Chinese), toggled with S -->
  <aside id="notes-panel">
    <div class="notes-head">Speaker notes · <span id="notes-scene"></span></div>
    <div id="notes-body"></div>
    <div class="notes-hint">press S to close</div>
  </aside>

  <!-- nav arrows -->
  <button id="prev-btn" class="navbtn" aria-label="previous scene">‹</button>
  <button id="next-btn" class="navbtn" aria-label="next scene">›</button>

  <div id="keyhelp">→ next · ← back · S notes · F fullscreen</div>

  <script src="vendor/pdf.min.js"></script>
  <script src="paper_data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
